name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        env:
          # Optional: add a repository variable SRK_MEET_SERVER_URL so the app
          # comes pre-filled with your meeting server address.
          SRK_MEET_SERVER_URL: ${{ vars.SRK_MEET_SERVER_URL }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SRK-Meet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SRK-Meet-apk
          path: SRK-Meet.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SRK Meet build ${{ github.run_number }}
          body: Install SRK-Meet.apk on your Android phone.
          files: SRK-Meet.apk
