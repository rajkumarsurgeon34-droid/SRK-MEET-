# Cloudflare Worker settings for the SRK Meet server.
# Cloudflare builds this automatically when the worker is connected to this
# GitHub repo with root directory "server".
name = "srkmeet"
main = "worker.js"
compatibility_date = "2025-01-01"

# Not secret: the LiveKit project address and key ID.
# The API Secret is added separately in Cloudflare as a Secret named LIVEKIT_API_SECRET.
[vars]
LIVEKIT_URL = "wss://srk-meet-6n4nciq0.livekit.cloud"
LIVEKIT_API_KEY = "APIQnxPPJ6GZhGT"
